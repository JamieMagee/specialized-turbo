[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specialized-turbo"
dynamic = ["version"]
description = "Python library for communicating with Specialized Turbo e-bikes over Bluetooth Low Energy"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Jamie Magee" }]
keywords = ["specialized", "turbo", "ebike", "ble", "bluetooth"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "bleak>=0.21.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
cloud = ["httpx>=0.27.0"]
dev = ["httpx>=0.27.0", "pytest>=9.0.2", "pytest-asyncio>=1.3.0"]

[project.scripts]
specialized-turbo = "specialized_turbo.cli:main"

[project.urls]
Homepage = "https://github.com/JamieMagee/specialized-turbo"
Repository = "https://github.com/JamieMagee/specialized-turbo"
Issues = "https://github.com/JamieMagee/specialized-turbo/issues"
Documentation = "https://github.com/JamieMagee/specialized-turbo/blob/main/docs/protocol.md"

[tool.hatch.version]
path = "specialized_turbo/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/*.xapk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Keep public re-exports grouped by API area.
"specialized_turbo/__init__.py" = ["I001", "RUF022"]

[tool.mypy]
strict = true
